<!DOCTYPE html>
<html lang="sv">
<head>
  <!-- Replaced by --base-href at build time (e.g. /klientportal-demo/). -->
  <base href="/klientportal-demo/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Demo av en kundportal för redovisningsbyråer: uppladdning, AI-tolkning och dialog per underlag.">
  <meta name="theme-color" content="#7E213A">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Klientportalen">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Klientportalen – demo</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #F4F3F3; }
    #loading {
      position: fixed; inset: 0; display: flex; align-items: center;
      justify-content: center; flex-direction: column; gap: 14px;
      font-family: Roboto, system-ui, sans-serif; color: #7E213A;
    }
    #loading .dot {
      width: 36px; height: 36px; border-radius: 50%;
      border: 4px solid #E8D3D9; border-top-color: #7E213A;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading"><div class="dot"></div><div>Laddar Klientportalen …</div></div>
  <script>
    window.addEventListener("flutter-first-frame", function () {
      var el = document.getElementById("loading");
      if (el) el.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
